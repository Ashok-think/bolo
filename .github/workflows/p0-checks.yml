name: P0 checks
on:
  pull_request:
  push:
    branches: [main, gpt-fixes]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:parser
      - run: npm run typecheck
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/parse-invoice/index.ts supabase/functions/converse/index.ts supabase/functions/speak-reply/index.ts supabase/functions/ai-health/index.ts
